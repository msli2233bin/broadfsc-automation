*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1117;color:#e0e0e0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
.header{background:#1a1d2e;border-bottom:1px solid #2a2a4a;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:22px;font-weight:600;color:#ffd740}
.header .refresh{background:#2a2a4a;border:none;color:#e0e0e0;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px}
.header .refresh:hover{background:#3a3a5a}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;padding:20px}
.card{background:#1a1d2e;border-radius:10px;padding:16px;border:1px solid #2a2a4a}
.card .label{font-size:12px;color:#888;text-transform:uppercase;letter-spacing:1px}
.card .value{font-size:28px;font-weight:700;margin:4px 0}
.card .sub{font-size:12px;color:#666}
.chart-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;padding:0 20px 20px}
.chart-card{background:#1a1d2e;border-radius:10px;padding:16px;border:1px solid #2a2a4a}
.chart-card h3{font-size:14px;color:#888;margin-bottom:12px;text-transform:uppercase;letter-spacing:1px}
canvas{max-height:300px}
.platform-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;padding:0 20px 20px}
.plat-card{background:#1a1d2e;border-radius:10px;padding:14px;border:1px solid #2a2a4a;text-align:center}
.plat-card .plat-name{font-size:12px;color:#888;text-transform:uppercase}
.plat-card .plat-posts{font-size:22px;font-weight:700;color:#42a5f5}
.plat-card .plat-ok{font-size:11px;color:#00c853}
.plat-card .plat-fail{font-size:11px;color:#ff1744}
.table-wrap{padding:0 20px 20px}
.table-card{background:#1a1d2e;border-radius:10px;border:1px solid #2a2a4a;overflow:hidden}
.table-card h3{padding:14px 16px 0;font-size:14px;color:#888;text-transform:uppercase;letter-spacing:1px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 16px;background:#16192b;color:#888;font-weight:500;border-bottom:1px solid #2a2a4a}
td{padding:8px 16px;border-bottom:1px solid #1e2240}
.status-success{color:#00c853;font-size:11px}
.status-failed{color:#ff1744;font-size:11px}
.funnel-wrap{padding:0 20px 20px}
.funnel{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.funnel-step{text-align:center;padding:12px 16px;background:#1a1d2e;border-radius:8px;border:1px solid #2a2a4a;min-width:100px}
.funnel-step .step-name{font-size:11px;color:#888;text-transform:uppercase}
.funnel-step .step-count{font-size:20px;font-weight:700;color:#ffd740}
.funnel-arrow{color:#42a5f5;font-size:20px}
.loading{text-align:center;padding:40px;color:#888}
.error{text-align:center;padding:40px;color:#ff1744}
.last-update{font-size:11px;color:#555;text-align:right;padding:8px 20px}
</style>

</head>
<body>
<div class="header">
    <h1>📊 BroadFSC Analytics</h1>
    <button class="refresh" onclick="loadData()">🔄 Refresh</button>
</div>

<div id="dashboard">
    <div class="loading">Loading data...</div>
</div>

<script>
const DAYS = 30;
let charts = {};

function destroyCharts() {
    Object.values(charts).forEach(c => c.destroy());
    charts = {};
}

async function loadData() {
    destroyCharts();
    document.getElementById('dashboard').innerHTML = '<div class="loading">Loading data...</div>';

    // Try embedded data first, then fetch from data.json
    try {
        if (window.__DATA__) {
            render(window.__DATA__);
            return;
        }
        // Fetch from local data.json
        const resp = await fetch('data.json');
        const data = await resp.json();
        render(data);
    } catch(e) {
        document.getElementById('dashboard').innerHTML =
            '<div class="error">Cannot load data.json. Run: python dashboard_api.py --days 30 -o data.json<br><small>' + e.message + '</small></div>';
    }
}

function render(data) {
    const o = data.overview || {};
    const ps = data.platform_summary || {};
    const sr = data.success_rates || {};
    const trend = data.trend || {};
    const posts = data.recent_posts || [];
    const funnel = data.funnel || {};
    const pipeline = data.pipeline || {};

    let html = '';

    // KPI cards
    html += '<div class="grid">';
    html += kpi('Total Posts', o.total_posts || 0, '#42a5f5');
    html += kpi('Clicks', o.total_clicks || 0, '#ab47bc');
    html += kpi('Conversations', o.total_conversations || 0, '#ff7043');
    html += kpi('Success Rate', (o.post_success_rate || 0) + '%', '#00c853');
    html += kpi('Website Visits', o.website_visits || 0, '#ffd740');
    html += kpi('Platforms', Object.keys(ps).length, '#e0e0e0');
    html += '</div>';

    // Platform summary cards
    html += '<div class="platform-grid">';
    const colors = ['#42a5f5','#ab47bc','#ff7043','#00c853','#ffd740','#ff5252','#69f0ae','#448aff'];
    let ci = 0;
    for (const [plat, info] of Object.entries(ps)) {
        const rate = sr[plat] || 0;
        html += `<div class="plat-card">
            <div class="plat-name">${plat}</div>
            <div class="plat-posts" style="color:${colors[ci%colors.length]}">${info.posts}</div>
            <div class="plat-ok">✅ ${rate}% success</div>
        </div>`;
        ci++;
    }
    html += '</div>';

    // Charts
    html += '<div class="chart-grid">';
    html += '<div class="chart-card"><h3>Post Trend (7 days)</h3><canvas id="trendChart"></canvas></div>';
    html += '<div class="chart-card"><h3>Platform Distribution</h3><canvas id="platformPie"></canvas></div>';
    html += '</div>';

    // Funnel
    html += '<div class="funnel-wrap"><div class="chart-card"><h3>Conversion Funnel</h3><div class="funnel">';
    const stages = [
        {key:'awareness', name:'Awareness', emoji:'👀'},
        {key:'interest', name:'Interest', emoji:'💡'},
        {key:'consideration', name:'Consider', emoji:'🤔'},
        {key:'conversation', name:'Chat', emoji:'💬'},
        {key:'lead', name:'Lead', emoji:'🔥'},
        {key:'customer', name:'Customer', emoji:'✅'},
    ];
    const funnelStages = funnel.stages || {};
    const fcolors = ['#42a5f5','#ab47bc','#ff7043','#ffd740','#ff5252','#00c853'];
    stages.forEach((s, i) => {
        const count = funnelStages[s.key] || 0;
        html += `<div class="funnel-step" style="border-color:${fcolors[i]}">
            <div class="step-name">${s.emoji} ${s.name}</div>
            <div class="step-count" style="color:${fcolors[i]}">${count}</div>
        </div>`;
        if (i < stages.length - 1) {
            const nextCount = funnelStages[stages[i+1].key] || 0;
            const conv = count > 0 ? Math.round(nextCount / count * 100) : 0;
            html += `<div class="funnel-arrow" title="${conv}% conversion">→ ${conv}% →</div>`;
        }
    });
    html += '</div></div></div>';
    html += '</div>';

    // Recent posts table
    html += '<div class="table-wrap"><div class="table-card"><h3>Recent Posts</h3><table>';
    html += '<thead><tr><th>Time</th><th>Platform</th><th>Type</th><th>Status</th><th>Preview</th></tr></thead><tbody>';
    for (const p of posts.slice(0, 15)) {
        const sc = p.status === 'success' ? 'status-success' : 'status-failed';
        html += `<tr>
            <td>${p.ts}</td>
            <td>${p.platform}</td>
            <td>${p.type}</td>
            <td class="${sc}">${p.status}</td>
            <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.preview || '-'}</td>
        </tr>`;
    }
    html += '</tbody></table></div></div>';

    html += `<div class="last-update">Last update: ${data.report_time || 'N/A'} | Data range: ${data.days || DAYS} days</div>`;

    document.getElementById('dashboard').innerHTML = html;

    // Render charts
    renderTrendChart(trend);
    renderPieChart(o.posts_by_platform || {});
}

function kpi(label, value, color) {
    return `<div class="card">
        <div class="label">${label}</div>
        <div class="value" style="color:${color}">${value}</div>
    </div>`;
}

function renderTrendChart(trend) {
    const ctx = document.getElementById('trendChart');
    if (!ctx) return;

    const days = Object.keys(trend.posts || {}).sort().slice(-14);
    const platforms = new Set();
    days.forEach(d => Object.keys(trend.posts[d] || {}).forEach(p => platforms.add(p)));

    const pal = ['#42a5f5','#ab47bc','#ff7043','#00c853','#ffd740','#ff5252'];
    const datasets = [];
    let pi = 0;
    platforms.forEach(p => {
        datasets.push({
            label: p,
            data: days.map(d => (trend.posts[d] || {})[p] || 0),
            borderColor: pal[pi % pal.length],
            backgroundColor: 'transparent',
            borderWidth: 2,
            tension: 0.3,
        });
        pi++;
    });

    charts.trend = new Chart(ctx, {
        type: 'line',
        data: { labels: days, datasets },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { labels: { color: '#888', font: { size: 11 } } } },
            scales: {
                x: { ticks: { color: '#666', font: { size: 10 } }, grid: { color: '#1e2240' } },
                y: { ticks: { color: '#666', stepSize: 1 }, grid: { color: '#1e2240' }, beginAtZero: true }
            }
        }
    });
}

function renderPieChart(data) {
    const ctx = document.getElementById('platformPie');
    if (!ctx) return;

    const pal = ['#42a5f5','#ab47bc','#ff7043','#00c853','#ffd740','#ff5252','#69f0ae','#448aff'];
    const labels = Object.keys(data);
    const values = Object.values(data);

    charts.pie = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels,
            datasets: [{
                data: values,
                backgroundColor: pal.slice(0, labels.length),
                borderColor: '#1a1d2e',
                borderWidth: 2,
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { position: 'right', labels: { color: '#888', font: { size: 11 }, padding: 12 } }
            }
        }
    });
}

// Auto-load on page load
loadData();
</script>
</body>
