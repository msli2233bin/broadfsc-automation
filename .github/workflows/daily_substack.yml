name: Daily Substack Auto-Post

on:
  schedule:
    # Daily at 08:00 Beijing time (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:  # Manual trigger

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install groq yfinance requests

    - name: Run AI Learning Agent (update knowledge base)
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        python ai_learning_agent.py || true

    - name: Generate & Publish Substack Article (via email)
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
        SUBSTACK_POST_EMAIL: ${{ secrets.SUBSTACK_POST_EMAIL }}
      run: |
        python substack_auto_post.py

    - name: Commit updated knowledge base
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add knowledge/ || true
        git commit -m "Auto-update knowledge base [skip ci]" || echo "No changes to commit"
        git push || echo "Push failed (might be no changes)"

    - name: Send Telegram Notification
      if: always()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        STATUS="${{ job.status }}"
        if [ "$STATUS" = "success" ]; then
          MSG="✅ Substack article published successfully! $(date +'%Y-%m-%d')"
        else
          MSG="❌ Substack auto-post failed! Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        fi
        curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d "chat_id=${TELEGRAM_CHAT_ID}&text=${MSG}" || true
