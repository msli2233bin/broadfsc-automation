name: Daily Stock TA Content Pool

on:
  schedule:
    # Run at 04:00 UTC (12:00 Beijing) — before social posting at 06:00
    - cron: '0 4 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-content:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance

      - name: Generate stock TA content pool
        run: python daily_stock_content.py

      - name: Commit & push content queue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "BroadFSC Bot"
          git config user.email "bot@broadfsc.com"
          git add knowledge/content_queue/ || true
          git diff --staged --quiet || git commit -m "chore(content): daily stock TA content pool refresh [skip ci]"
          git push https://x-access-token:${GH_TOKEN}@github.com/msli2233bin/broadfsc-automation.git HEAD:main
