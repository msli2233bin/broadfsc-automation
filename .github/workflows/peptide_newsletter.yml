name: RTPeptide Weekly Newsletter

on:
  schedule:
    - cron: "0 3 * * 1"   # 每周一 03:00 UTC, 北京时间 11:00
  workflow_dispatch:

permissions:
  contents: read

jobs:
  newsletter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install groq requests
      - name: Generate & send newsletter
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PEPTIDE_CHANNEL_ID: ${{ secrets.TELEGRAM_PEPTIDE_CHANNEL_ID }}
        run: python peptide_newsletter.py
