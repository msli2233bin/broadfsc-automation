name: RTPeptide SEO Refresh

on:
  schedule:
    - cron: "15 3 * * *"   # 03:15 UTC, 北京时间 11:15
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate SEO site
        run: python build_peptide_seo.py
      - name: Submit URLs to IndexNow
        run: python submit_indexnow.py
      - name: Commit refreshed site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/peptide-seo/
          if ! git diff --cached --quiet; then
            git commit -m "auto: refresh peptide SEO catalogue ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "no changes"
          fi
