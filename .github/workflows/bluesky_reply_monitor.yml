name: Bluesky Reply Monitor

on:
  schedule:
    # 每30分钟运行一次（UTC时间，对应北京时间+8）
    - cron: '*/30 * * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install atproto requests python-dotenv groq
    
    - name: Run Bluesky reply monitor
      env:
        BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
        BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: python bluesky_reply_monitor.py
    
    - name: Commit and push state updates
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
        git add .bot_memory/bluesky_reply_monitor.json .bot_memory/signal_engagers.json || true
        git diff --staged --quiet && echo "No changes to commit" || (git commit -m "🤖 自动更新Bluesky回复监控状态" && git push)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
